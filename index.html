    function App() {
      const [activeTab, setActiveTab] = useState('inicio');

      // Calming Ambient Sound Audio Synthesizer
      const [isAudioPlaying, setIsAudioPlaying] = useState(false);
      const audioCtxRef = useRef(null);
      const noiseNodeRef = useRef(null);
      const gainNodeRef = useRef(null);

      const toggleCalmAudio = () => {
        if (isAudioPlaying) {
          if (gainNodeRef.current && audioCtxRef.current) {
            gainNodeRef.current.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + 1);
            setTimeout(() => {
              if (audioCtxRef.current) audioCtxRef.current.suspend();
              setIsAudioPlaying(false);
            }, 1000);
          }
        } else {
          try {
            if (!audioCtxRef.current) {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              const ctx = new AudioContext();
              audioCtxRef.current = ctx;

              const bufferSize = ctx.sampleRate * 2;
              const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const output = noiseBuffer.getChannelData(0);
              let lastOut = 0.0;
              for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 3.2;
              }

              const whiteNoise = ctx.createBufferSource();
              whiteNoise.buffer = noiseBuffer;
              whiteNoise.loop = true;

              const filter = ctx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.value = 320;

              const lfo = ctx.createOscillator();
              lfo.type = 'sine';
              lfo.frequency.value = 0.11;

              const lfoGain = ctx.createGain();
              lfoGain.gain.value = 180;

              lfo.connect(lfoGain);
              lfoGain.connect(filter.frequency);

              const gainNode = ctx.createGain();
              gainNode.gain.value = 0.14;

              whiteNoise.connect(filter);
              filter.connect(gainNode);
              gainNode.connect(ctx.destination);

              whiteNoise.start();
              lfo.start();

              noiseNodeRef.current = whiteNoise;
              gainNodeRef.current = gainNode;
            } else {
              audioCtxRef.current.resume();
            }
            setIsAudioPlaying(true);
          } catch (e) {
            console.error("Audio error:", e);
          }
        }
      };

      // Triage Quiz State
      const [quizAnswers, setQuizAnswers] = useState({ symptom: '', urgency: '' });
      const [quizSubmitted, setQuizSubmitted] = useState(false);

      // Step completion tracking
      const [completedSteps, setCompletedSteps] = useState(() => {
        try {
          const saved = localStorage.getItem('serena_completed_steps');
          return saved ? JSON.parse(saved) : { step1: false, step2: false, step3: false, step4: false, grounding: false };
        } catch (e) {
          return { step1: false, step2: false, step3: false, step4: false, grounding: false };
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('serena_completed_steps', JSON.stringify(completedSteps));
        } catch (e) {}
      }, [completedSteps]);

      const toggleStep = (stepKey) => {
        setCompletedSteps(prev => ({ ...prev, [stepKey]: !prev[stepKey] }));
      };

      // Step 1 Interactive State
      const [somaticRegion, setSomaticRegion] = useState('peito'); // 'peito' | 'garganta' | 'barriga' | 'cabeca' | 'ombros'
      const [somaticMotionType, setSomaticMotionType] = useState('girando'); // 'girando' | 'vai-vem' | 'pulsando' | 'vibrando'
      const [somaticSpeed, setSomaticSpeed] = useState(6); // 1 - 10
      const [somaticDirection, setSomaticDirection] = useState('horario'); // 'horario' | 'anti-horario'
      const [isSomaticReverted, setIsSomaticReverted] = useState(false);
      const [somaticStepGuide, setSomaticStepGuide] = useState(1);
      const [visualTrackerMode, setVisualTrackerMode] = useState('bola'); // 'bola' | 'mao'

      const regionDetails = {
        peito: { title: 'Peito / Coração', desc: 'Aperto no peito ou aceleração cardíaca.', icon: 'Heart', defaultMotion: 'girando' },
        garganta: { title: 'Garganta / Pescoço', desc: 'Sensação de "nó", sufocamento ou trava no eixo.', icon: 'BreathIcon', defaultMotion: 'vai-vem' },
        barriga: { title: 'Estômago / Plexo', desc: 'Frio na barriga, nó em espiral ou turbilhão.', icon: 'Compass', defaultMotion: 'girando' },
        cabeca: { title: 'Cabeça / Mente', desc: 'Pressão nas têmporas ou zumbido em vibração.', icon: 'Brain', defaultMotion: 'vibrando' },
        ombros: { title: 'Ombros / Costas', desc: 'Tensão muscular e peso contraindo/expandindo.', icon: 'Shield', defaultMotion: 'pulsando' }
      };

      const motionLabels = {
        girando: { name: 'Girando no Entorno', desc: 'Rotação contínua ao redor do centro do sintoma' },
        'vai-vem': { name: 'De um Lado para Outro (Eixo)', desc: 'Balanço oscilante transversal ou vertical no eixo' },
        pulsando: { name: 'Pulsando / Expandindo', desc: 'Aperto que infla e desacelera do centro para fora' },
        vibrando: { name: 'Onda / Vibração', desc: 'Oscilação em onda zigue-zague acelerada' }
      };

      const [breathePhase, setBreathePhase] = useState('idle');
      const [breatheCounter, setBreatheCounter] = useState(0);
      const [breatheCyclesLeft, setBreatheCyclesLeft] = useState(3);
      const breatheIntervalRef = useRef(null);

      const startBreathing = () => {
        setBreatheCyclesLeft(3);
        runBreathingCycle(3);
      };

      const stopBreathing = () => {
        if (breatheIntervalRef.current) clearInterval(breatheIntervalRef.current);
        setBreathePhase('idle');
        setBreatheCounter(0);
      };

      const runBreathingCycle = (remainingCycles) => {
        if (remainingCycles <= 0) {
          setBreathePhase('idle');
          setCompletedSteps(prev => ({ ...prev, step2: true }));
          return;
        }

        setBreathePhase('inhale');
        let count = 4;
        setBreatheCounter(count);

        const inhaleTimer = setInterval(() => {
          count--;
          setBreatheCounter(count);
          if (count <= 0) {
            clearInterval(inhaleTimer);
            setBreathePhase('hold');
            let holdCount = 7;
            setBreatheCounter(holdCount);

            const holdTimer = setInterval(() => {
              holdCount--;
              setBreatheCounter(holdCount);
              if (holdCount <= 0) {
                clearInterval(holdTimer);
                setBreathePhase('exhale');
                let exhaleCount = 8;
                setBreatheCounter(exhaleCount);

                const exhaleTimer = setInterval(() => {
                  exhaleCount--;
                  setBreatheCounter(exhaleCount);
                  if (exhaleCount <= 0) {
                    clearInterval(exhaleTimer);
                    setBreatheCyclesLeft(remainingCycles - 1);

                      <label className="block text-amberWarm-800 font-bold">3º Quê:</label>

                      <textarea 
                        rows="2" 
                        value={que3} 
                        onChange={e => setQue3(e.target.value)}
                        className="w-full p-2 border rounded-lg focus:outline-none text-xs"
                        placeholder="Ativar a ancoragem física..."
                      ></textarea>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-darkNavy-900 hover:bg-darkNavy-800 text-white font-bold py-3 rounded-xl transition-all shadow text-xs"
                  >
                    Gerar Refatoração Crítica do Pensamento
                  </button>
                </form>

                {spaGenerated && (
                  <div className="p-4 bg-amberWarm-50 border border-amberWarm-200 rounded-2xl space-y-2">
                    <div className="flex items-center space-x-2 text-amberWarm-950 font-bold text-xs">
                      <Icon name="CheckCircle" className="w-4 h-4 text-amberWarm-600" />
                      <span>Pensamento Desconstruído com Sucesso!</span>
                    </div>
                    <p className="text-xs text-slate-700 italic">
                      "A mente acalmada retoma a capacidade de análise objetiva. O condutor está no comando."
                    </p>
                  </div>
                )}
              </div>

            </section>

            {/* Aterramento Sensorial */}
            <section id="aterramento" className="bg-white rounded-3xl p-6 sm:p-8 border border-alabaster-200 shadow-sm space-y-6">
              <div className="flex items-start justify-between border-b border-alabaster-100 pb-4">
                <div>
                  <div className="inline-flex items-center space-x-1.5 text-xs font-semibold text-softPurple-800 bg-softPurple-50 px-2.5 py-1 rounded-md mb-2">
                    <Icon name="Hand" className="w-3.5 h-3.5 text-softPurple-600" />
                    <span>Aterramento Sensorial Perceptivo</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-900">Técnica de Aterramento 5-4-3-2-1</h2>
                  <p className="text-xs sm:text-sm text-slate-500">Essencial em momentos de sensação de desconexão ou irrealidade.</p>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                {[
                  { num: 5, label: 'Coisas que você VE', icon: 'Eye', color: 'border-amberWarm-200 bg-amberWarm-50/60' },
                  { num: 4, label: 'Coisas que você TOCA', icon: 'Hand', color: 'border-softPurple-200 bg-softPurple-50/60' },
                  { num: 3, label: 'Sons que você OUVE', icon: 'Ear', color: 'border-sage-200 bg-sage-50/60' },
                  { num: 2, label: 'Aromas que SENTIR', icon: 'Sparkles', color: 'border-alabaster-300 bg-alabaster-100/60' },
                  { num: 1, label: 'Sabor que PERCEBE', icon: 'Heart', color: 'border-amberWarm-300 bg-amberWarm-100/60' }
                ].map((item) => (
                  <div key={item.num} className={`p-4 rounded-2xl border ${item.color} space-y-2`}>
                    <div className="flex items-center justify-between">
                      <span className="text-lg font-extrabold font-heading text-slate-900">{item.num}</span>
                      <Icon name={item.icon} className="w-5 h-5 text-slate-700" />
                    </div>
                    <p className="font-semibold text-xs text-slate-800">{item.label}</p>
                    <p className="text-[11px] text-slate-500 leading-tight">Observe em voz alta ao seu redor.</p>
                  </div>
                ))}
              </div>
            </section>

            {/* Diário de Crises */}
            <section id="diario" className="bg-white rounded-3xl p-6 sm:p-8 border border-alabaster-200 shadow-sm space-y-6">
              <div className="flex items-start justify-between border-b border-alabaster-100 pb-4">
                <div>
                  <div className="inline-flex items-center space-x-1.5 text-xs font-semibold text-amberWarm-800 bg-amberWarm-50 px-2.5 py-1 rounded-md mb-2">
                    <Icon name="History" className="w-3.5 h-3.5 text-amberWarm-600" />
                    <span>Registro do Sujeito</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-900">Diário de Crises e Evolução</h2>
                  <p className="text-xs sm:text-sm text-slate-500">Registre suas sessões para reforçar no inconsciente a sua capacidade de pacificação.</p>
                </div>
                {crisisLogs.length > 0 && (
                  <button 
                    onClick={handleClearLogs}
                    className="text-xs text-amberWarm-600 hover:text-amberWarm-700 font-semibold"
                  >
                    Limpar Diário
                  </button>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <form onSubmit={handleAddCrisisLog} className="bg-alabaster-50 p-5 rounded-2xl border border-alabaster-200 space-y-3 text-xs">
                  <h4 className="font-bold text-slate-900 text-sm">Registrar Conclusão de Exercício</h4>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Ansiedade Inicial (1-10):</label>
                      <input 
                        type="number" 
                        min="1" 
                        max="10" 
                        value={newLog.initialAnxiety} 
                        onChange={e => setNewLog({ ...newLog, initialAnxiety: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-200 bg-white font-bold text-amberWarm-600 text-center text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Ansiedade Final (1-10):</label>
                      <input 
                        type="number" 
                        min="1" 
                        max="10" 
                        value={newLog.finalAnxiety} 
                        onChange={e => setNewLog({ ...newLog, finalAnxiety: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-200 bg-white font-bold text-softPurple-600 text-center text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Anotações da Sessão:</label>
                    <textarea 
                      rows="2"
                      value={newLog.notes} 
                      onChange={e => setNewLog({ ...newLog, notes: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-200 bg-white text-xs"
                      placeholder="Ex: Consegui desacelerar a rotação e desarmar a tensão..."
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-amberWarm-500 hover:bg-amberWarm-600 text-white font-semibold py-2.5 rounded-xl transition-all shadow text-xs"
                  >
                    Salvar Registro de Evolução
                  </button>
                </form>

                <div className="space-y-3 overflow-y-auto max-h-72 pr-1">
                  {crisisLogs.length === 0 ? (
                    <div className="p-8 text-center bg-alabaster-50 rounded-2xl border border-dashed border-alabaster-200 space-y-1">
                      <Icon name="History" className="w-8 h-8 text-slate-300 mx-auto" />
                      <p className="text-xs font-semibold text-slate-600">Nenhum registro armazenado</p>
                      <p className="text-[11px] text-slate-400">Seus registros de evolução serão salvos localmente em seu navegador.</p>
                    </div>
                  ) : (
                    crisisLogs.map(log => (
                      <div key={log.id} className="p-3.5 bg-white border border-slate-200 rounded-xl space-y-1 shadow-sm">
                        <div className="flex items-center justify-between text-xs">
                          <span className="text-[10px] text-slate-400">{log.date}</span>
                          <div className="flex items-center space-x-2">
                            <span className="text-[10px] bg-amberWarm-50 text-amberWarm-700 px-1.5 py-0.5 rounded font-bold">Antes: {log.initialAnxiety}</span>
                            <span className="text-[10px] bg-softPurple-100 text-softPurple-800 px-1.5 py-0.5 rounded font-bold">Depois: {log.finalAnxiety}</span>
                          </div>
                        </div>
                        <p className="text-xs text-slate-700 font-medium">{log.notes}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </section>

            {}
            <section className="bg-gradient-to-r from-darkNavy-950 via-softPurple-900 to-darkNavy-900 rounded-3xl p-6 sm:p-10 text-white text-center space-y-6 shadow-xl relative overflow-hidden">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-amberWarm-500/20 text-amberWarm-300 flex items-center justify-center border border-amberWarm-500/30">
                <Icon name="MessageCircle" className="w-8 h-8" />
              </div>

              <div className="space-y-2 max-w-2xl mx-auto">
                <h2 className="text-2xl sm:text-3xl font-extrabold font-heading">
                  Acompanhamento Psicanalítico Especializado
                </h2>
                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                  Estes exercícios contêm a crise no sintoma presente. Para investigar as causas inconscientes e ressignificar as angústias de forma duradoura, agende uma consulta com o <strong>Psicanalista Daniel Silva (INJAVI)</strong>.
                </p>
              </div>

              <div className="pt-2">
                <a
                  href="https://wa.me/5511940817534?text=Ol%C3%A1%20Daniel%20Silva%20(INJAVI)%2C%20acessei%20o%20app%20Serena%20e%20gostaria%20de%20agendar%20uma%20consulta%20psicanal%C3%ADtica."
                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex items-center space-x-3 bg-amberWarm-500 hover:bg-amberWarm-600 text-white font-extrabold text-xs sm:text-base px-8 py-4 rounded-2xl transition-all duration-300 hover:scale-105 shadow-lg active:scale-95"
                >
                  <Icon name="MessageCircle" className="w-5 h-5 sm:w-6 sm:h-6" />
                  <span>Agendar Consulta no WhatsApp: (11) 94081-7534</span>
                </a>
              </div>

              <div className="flex flex-wrap justify-center items-center gap-4 text-xs text-slate-400 pt-2">
                <span>Instagram: @injaviinstituto</span>
                <span>•</span>
                <span>@danielsilvapsicanalista</span>
              </div>
            </section>

            {/* Footer */}
            <footer className="text-center text-[11px] text-slate-400 pt-6 pb-12 border-t border-alabaster-200 space-y-2">
              <p><strong>Nota Informativa:</strong> O aplicativo Serena é um recurso de auto-regulação baseado em PNL e Psicanálise para apoio em momentos de ansiedade.</p>
              <p>© INJAVI — Instituto Jardim da Vida | Desenvolvido por Daniel Silva (Psicanalista)</p>
            </footer>

          </main>

          {/* Bottom Bar Mobile Navigation with Dark Navy Theme */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-darkNavy-900/95 backdrop-blur-md border-t border-darkNavy-800 shadow-lg px-2 py-2 flex items-center justify-around text-white">
            <button
              onClick={() => scrollToSection('inicio')}
              className={`flex flex-col items-center space-y-0.5 text-[10px] font-medium ${activeTab === 'inicio' ? 'text-amberWarm-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="Heart" className="w-5 h-5" />
              <span>Início</span>
            </button>

            <button
              onClick={() => scrollToSection('passo1')}
              className={`flex flex-col items-center space-y-0.5 text-[10px] font-medium ${activeTab === 'passo1' ? 'text-amberWarm-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="Circle" className="w-5 h-5" />
              <span>Movimento</span>
            </button>

            <button
              onClick={() => scrollToSection('passo2')}
              className={`flex flex-col items-center space-y-0.5 text-[10px] font-medium ${activeTab === 'passo2' ? 'text-amberWarm-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="BreathIcon" className="w-5 h-5" />
              <span>Respiração</span>
            </button>

            <button
              onClick={() => scrollToSection('protocolo')}
              className={`flex flex-col items-center space-y-0.5 text-[10px] font-medium ${activeTab === 'protocolo' ? 'text-amberWarm-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="Shield" className="w-5 h-5" />
              <span>Método</span>
            </button>

            <a
              href="https://wa.me/5511940817534?text=Ol%C3%A1%20Daniel%20Silva%20(INJAVI)%2C%20gostaria%20de%20agendar%20uma%20consulta%20psicanal%C3%ADtica."
              target="_blank"
              rel="noopener noreferrer"
              className="flex flex-col items-center space-y-0.5 text-[10px] font-bold text-amberWarm-400"
            >
              <Icon name="MessageCircle" className="w-5 h-5" />
              <span>Contato</span>
            </a>
          </div>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
